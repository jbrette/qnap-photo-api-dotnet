[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qnap-photo-api"
version = "26.11.13"
description = "Async Python client for the QNAP Photo Station API, with an optional FastAPI image proxy."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
classifiers = ["Typing :: Typed"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.13.4",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff==0.16.3",  # keep in step with the ruff-pre-commit rev in ../.pre-commit-config.yaml
  "pre-commit>=3.8",
  "types-defusedxml>=0.7",
  "fastapi>=0.110",  # proxy tests and examples/ type-check against it
  "httpx2",  # starlette.testclient requires it; plain httpx there is deprecated
]

[tool.hatch.build.targets.wheel]
packages = ["src/qnap_photo_api"]

# ---------------------------------------------------------------------------
# ruff: every rule family enabled; each ignore below is a documented conflict,
# not a convenience.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E501",    # line length is the formatter's job (as in the shared config)
  "D203",    # conflicts with D211 (no blank line before class docstring)
  "D213",    # conflicts with D212 (summary on the first docstring line)
  "COM812",  # conflicts with the ruff formatter
  "ISC001",  # conflicts with the ruff formatter
  "CPY001",  # no per-file copyright headers; licence is in pyproject/LICENSE
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",     # pytest asserts
  "D",        # test names are the documentation
  "PLR2004",  # literal expected values are the point of a test
  "INP001",   # tests/ is not a package
  "DTZ001",   # QNAP timestamps are naive NAS-local times by design
]
"examples/**" = [
  "INP001",   # examples/ is not a package
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false
suppress-dummy-args = false
allow-star-arg-any = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
known-first-party = ["qnap_photo_api"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: --strict plus every optional error code that is sound for this code.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "examples"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_unimported = true
extra_checks = true
strict_bytes = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "possibly-undefined",
  "unused-awaitable",
  "unused-ignore",
  "explicit-override",
  "mutable-override",
  "deprecated",
  "exhaustive-match",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=src --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
