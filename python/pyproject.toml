[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qnap-photo-api"
version = "0.8.1"
description = "Async Python client for the QNAP Photo Station API, with an optional FastAPI image proxy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "fastapi>=0.110",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qnap_photo_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
